<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Riservata Sposi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="loginBox">
        <h2>Area Riservata</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Accedi</button>
        </form>
    </div>

    <div class="container admin-container hidden" id="dashboardBox">
        <h2>Dashboard Invitati</h2>
        <button id="logoutBtn" style="background-color: #d9534f; width: auto; padding: 5px 10px; margin-bottom: 15px;">Esci</button>
        
        <div class="stats">
            <div>Presenti Confermati: <span id="totPresenti">0</span></div>
            <div>Assenti: <span id="totAssenti">0</span></div>
            <div>Totale +1: <span id="totPlusOne">0</span></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nome Invitato</th>
                    <th>Presenza</th>
                    <th>Nome +1</th>
                    <th>Intolleranze/Note</th>
                </tr>
            </thead>
            <tbody id="tabellaInvitati">
                </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // INCOLLA LA STESSA CONFIGURAZIONE DI INDEX.HTML
        const firebaseConfig = {
            apiKey: "INCOLLA_QUI",
            authDomain: "INCOLLA_QUI",
            projectId: "INCOLLA_QUI",
            storageBucket: "INCOLLA_QUI",
            messagingSenderId: "INCOLLA_QUI",
            appId: "INCOLLA_QUI"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Controllo Login
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboardBox').classList.remove('hidden');
                caricaDati();
            } else {
                document.getElementById('loginBox').classList.remove('hidden');
                document.getElementById('dashboardBox').classList.add('hidden');
            }
        });

        // Esegui Login
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => alert("Credenziali errate!"));
        });

        // Esegui Logout
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // Carica dati nella tabella
        async function caricaDati() {
            const querySnapshot = await getDocs(collection(db, "invitati"));
            const tbody = document.getElementById('tabellaInvitati');
            tbody.innerHTML = '';
            
            let presenti = 0; let assenti = 0; let plusOneCount = 0;

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                
                if(data.presenza === 'si') presenti++;
                if(data.presenza === 'no') assenti++;
                if(data.plusOne && data.plusOne.trim() !== '') plusOneCount++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${data.nome}</td>
                    <td style="color: ${data.presenza==='si'?'green':'red'}">${data.presenza.toUpperCase()}</td>
                    <td>${data.plusOne || '-'}</td>
                    <td>${data.note || '-'}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totPresenti').innerText = presenti;
            document.getElementById('totAssenti').innerText = assenti;
            document.getElementById('totPlusOne').innerText = plusOneCount;
        }
    </script>
</body>
</html>
